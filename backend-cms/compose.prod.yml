name: atf-backend-cms-prod

services:
  payload:
    build:
      target: production
    environment:
      DATABASE_URI: "${DATABASE_URI:?Set DATABASE_URI in .env.prod}"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PAYLOAD_ALLOWED_ORIGINS: "${PAYLOAD_ALLOWED_ORIGINS:?Set PAYLOAD_ALLOWED_ORIGINS in .env.prod}"
      PAYLOAD_PUBLIC_SERVER_URL: "${PAYLOAD_PUBLIC_SERVER_URL:?Set PAYLOAD_PUBLIC_SERVER_URL in .env.prod}"
      PAYLOAD_PUBLIC_SITE_ORIGIN: "${PAYLOAD_PUBLIC_SITE_ORIGIN:?Set PAYLOAD_PUBLIC_SITE_ORIGIN in .env.prod}"
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.prod}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - name: payload-http
        target: 3001
        published: "${PAYLOAD_PORT:-3001}"
        host_ip: "${PAYLOAD_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}"
    restart: unless-stopped
