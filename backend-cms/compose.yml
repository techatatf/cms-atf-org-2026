name: atf-backend-cms

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    init: true
    networks:
      - cms
    volumes:
      - payload_media:/app/media

  postgres:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cms
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  cms:

volumes:
  payload_media:
  postgres_data:
