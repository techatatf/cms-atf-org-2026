services:
  payload:
    build:
      target: development
    command: npm run dev
    environment:
      DATABASE_URI: postgresql://payload:payload_local_dev@postgres:5432/atf_cms
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
      PAYLOAD_ALLOWED_ORIGINS: "${PAYLOAD_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}"
      PAYLOAD_PUBLIC_SERVER_URL: "${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3001}"
      PAYLOAD_PUBLIC_SITE_ORIGIN: "${PAYLOAD_PUBLIC_SITE_ORIGIN:-http://localhost:3000}"
      PAYLOAD_SECRET: local-development-secret-change-before-production
    ports:
      - "${PAYLOAD_DEV_BIND_ADDRESS:-0.0.0.0}:${PAYLOAD_DEV_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: .
        target: /app
      - payload_node_modules:/app/node_modules
      - payload_next_cache:/app/.next
      - payload_media:/app/media

  postgres:
    environment:
      POSTGRES_DB: atf_cms
      POSTGRES_PASSWORD: payload_local_dev
      POSTGRES_USER: payload

volumes:
  payload_next_cache:
  payload_node_modules:
